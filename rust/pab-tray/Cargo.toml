[package]
name = "pab-tray"
description = "PtcglAutoBattleLog.exe: the tray app, installer, repair daemon and updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "PtcglAutoBattleLog"
path = "src/main.rs"

[dependencies]
pab-core = { path = "../pab-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
notify = { version = "9", default-features = false }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
winreg = "0.56"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
