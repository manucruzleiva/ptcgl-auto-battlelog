[package]
name = "pab-tray"
description = "PtcglAutoBattleLog.exe: the tray app, installer, repair daemon and updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "PtcglAutoBattleLog"
path = "src/main.rs"

[dependencies]
pab-core = { path = "../pab-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
png = "0.18"
notify = { version = "9", default-features = false }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
winit = { version = "0.30", default-features = false }
mslnk = "0.1.8"
ureq = { version = "3.5", default-features = false, features = ["native-tls", "gzip", "win-system-proxy"] }
winreg = "0.56"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
