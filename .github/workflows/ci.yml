# Every push and pull request: the full build.sh pipeline on Linux (tests, seal cross-check, exe,
# portable zip, update.json), uploaded as an artifact; and build.ps1 on Windows PowerShell 5.1,
# which also runs both test suites on Windows.
name: CI

on:
  push:
    branches: ['**']        # tags are built by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Builds point their updater at the repository they are built in (forks included).
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  linux:
    name: build.sh (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # the exact SDK: reproducible builds

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The pinned BepInEx zip; build.sh verifies its SHA-256 whether it comes from here or GitHub.
      - uses: actions/cache@v6
        with:
          path: cache
          key: bepinex-5.4.23.3-win-x64

      - name: Test, build and package
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PtcglAutoBattleLog-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: build.ps1 (windows, PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # the exact SDK: reproducible builds

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/cache@v6
        with:
          path: cache
          key: bepinex-5.4.23.3-win-x64

      - name: Test, build and package
        shell: powershell
        run: .\build.ps1
