name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do not include anything private: logs can contain your
        Windows user name, and battle logs contain player names.
        Security problems: please use [private reporting](https://github.com/manucruzleiva/ptcgl-auto-battlelog/security/advisories/new) instead (see SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: The first line of the tray menu, e.g. "PTCGL Auto Battle Log v1.1.0".
      placeholder: v1.1.0
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Installed or portable?
      options:
        - Installed (PtcglAutoBattleLog.exe)
        - Portable (PtcglAutoBattleLog-portable.zip)
        - Not installed yet / the installer failed
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings → System → About, e.g. "Windows 11 23H2".
    validations:
      required: true

  - type: dropdown
    id: other-mods
    attributes:
      label: Do you use other BepInEx mods in Pokémon TCG Live?
      options:
        - "No"
        - "Yes"
        - Not sure

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic info
      description: Tray menu → Diagnostics → Copy diagnostic info, then paste here.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        From `%LOCALAPPDATA%\PtcglAutoBattleLog\tray.log` (portable: `data\tray.log`), the game's
        `BepInEx\LogOutput.log` (lines with `PTCGL Auto Battle Log`), and
        `%LOCALAPPDATA%\PtcglAutoBattleLog\plugin-status.json`. You can also drag the files here.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read the Troubleshooting section of the README and searched existing issues.
          required: true
        - label: I understand this is an unofficial mod used at my own risk (see DISCLAIMER.md).
          required: true
